<body>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const $ = id => document.getElementById(id);
  window.lucide?.createIcons();
  const state = { mainSpeed:.65, freightSpeed:.45, lights:true, cycle:true, crane:true, time:15, paused:false };
  const canvas = $('world');
  const renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.22;
  const scene = new THREE.Scene();
  scene.background=new THREE.Color('#cbdcd5');
  scene.fog=new THREE.Fog('#cbdcd5',90,170);
  const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.1,240);
  const orbit=new OrbitControls(camera,canvas);
  orbit.enableDamping=true;orbit.dampingFactor=.07;
  orbit.minDistance=23;orbit.maxDistance=88;
  orbit.maxPolarAngle=Math.PI*.47;orbit.minPolarAngle=.28;
  orbit.maxAzimuthAngle=.95;orbit.minAzimuthAngle=-.95;
  orbit.enablePan=false;
  function resetView(){const mobile=innerWidth<650;camera.position.set(mobile?26:30,mobile?55:31,mobile?116:43);orbit.maxDistance=mobile?150:88;scene.fog.near=mobile?150:90;scene.fog.far=mobile?250:170;orbit.target.set(0,7.4,0);camera.fov=mobile?49:39;camera.updateProjectionMatrix();orbit.update();}
  resetView();
  const hemi=new THREE.HemisphereLight('#edf7ff','#7b8462',2.2);scene.add(hemi);
  const sun=new THREE.DirectionalLight('#fff1cf',3.5);sun.position.set(-24,44,20);sun.castShadow=true;
  Object.assign(sun.shadow.camera,{left:-29,right:29,top:28,bottom:-28,near:1,far:100});
  sun.shadow.mapSize.set(2048,2048);sun.shadow.normalBias=.035;sun.shadow.bias=-.00015;scene.add(sun);sun.target.position.set(0,8,0);scene.add(sun.target);
  const fill=new THREE.DirectionalLight('#e0f4ee',.6);fill.position.set(15,20,-30);scene.add(fill);
  const roomLight=new THREE.PointLight('#ffda9b',70,85,2);roomLight.position.set(0,30,0);scene.add(roomLight);

  const materialCache=new Map();
  function mat(color,opts={}){const key=color+JSON.stringify(opts);if(!materialCache.has(key))materialCache.set(key,new THREE.MeshStandardMaterial({color,roughness:.85,...opts}));return materialCache.get(key);}
  const boxGeo=new THREE.BoxGeometry(1,1,1);
  const staticRoot=new THREE.Group();scene.add(staticRoot);
  const land=new THREE.Group();land.position.y=8;staticRoot.add(land);
  const animated=new THREE.Group();animated.position.y=8;scene.add(animated);
  function box(parent,x,y,z,w,h,d,color,opts={}){const m=new THREE.Mesh(boxGeo,typeof color==='object'?color:mat(color,opts));m.position.set(x,y,z);m.scale.set(w,h,d);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
  function group(parent,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);return g;}
  function cylinder(parent,x,y,z,rt,rb,h,color,n=12){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),typeof color==='object'?color:mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
  function beam(parent,a,b,width,color,depth=width){const va=new THREE.Vector3(...a),vb=new THREE.Vector3(...b);const m=box(parent,...va.clone().add(vb).multiplyScalar(.5).toArray(),width,va.distanceTo(vb),depth,color);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),vb.sub(va).normalize());return m;}
  let seed=1932;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
  function pick(a){return a[Math.floor(rand()*a.length)];}
  const glow=mat('#ffe9a7',{emissive:'#ffbf54',emissiveIntensity:.25,roughness:.35});
  const redGlow=mat('#d34139',{emissive:'#ff3227',emissiveIntensity:.6});
  const greenGlow=mat('#9cc76c',{emissive:'#72ff66',emissiveIntensity:.8});
  const waterMat=mat('#329ba9',{metalness:.25,roughness:.27});
  const labels=[];
  function label(parent,text,x,y,z,w,h,bg='#f0e8cf',fg='#244f4a',font=48){
    const c=document.createElement('canvas');c.width=1024;c.height=Math.round(1024*h/w);const ctx=c.getContext('2d');ctx.fillStyle=bg;ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle=fg;ctx.font=`bold ${Math.min(c.height*.6,font)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,512,c.height/2,970);
    const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:tex,roughness:.9}));m.position.set(x,y,z);parent.add(m);labels.push(m);return m;
  }

  // The room and joinery establish the miniature's physical scale.
  box(staticRoot,0,-.35,0,320,.6,320,'#8e9a85');
  for(let i=-14;i<15;i++)for(let j=-40;j<41;j++)box(staticRoot,i*7.7+(j%2)*3.85,-.025,j*3.5,7.66,.06,3.46,['#a5a188','#aba790','#a09c83','#b4af96'][Math.abs(i*17+j*7)%4]);
  box(staticRoot,0,60,-29,120,120,.7,'#b7cbc0');box(staticRoot,-42,60,0,.7,120,240,'#c6d7c9');
  box(staticRoot,0,1,-28.55,120,2,.2,'#dae2d0');box(staticRoot,-41.5,1,0,.2,2,110,'#dae2d0');
  // Window panes are emissive procedural geometry, with no external textures.
  for(const x of [-28,-12]){
    box(staticRoot,x,26,-28.45,12,17,.3,'#f2f0da');
    box(staticRoot,x,26,-28.2,10.7,15.7,.15,mat('#c2e5e9',{emissive:'#b8dfe5',emissiveIntensity:.55}));
    box(staticRoot,x,26,-27.95,.3,16,.35,'#e9eddd');box(staticRoot,x,26,-27.95,11,.3,.35,'#e9eddd');box(staticRoot,x,17.5,-27.6,13,.45,1.8,'#e4e6d4');
  }
  box(staticRoot,17,23,-28.1,12,8,.5,'#647c6e');box(staticRoot,17,23,-27.8,11.2,7.2,.1,'#e5e4cb');
  label(staticRoot,'MERIDIAN RAILWAY',17,24.8,-27.69,10,1,'#e5e4cb','#496c60',75);
  label(staticRoot,'COAST - HARBOR - HIGHLANDS',17,21,-27.69,10,.7,'#e5e4cb','#758778',44);
  for(let i=0;i<13;i++)box(staticRoot,12+i*.82,22.3,-27.65,.75,.35+Math.sin(i*.6)*.5,.05,pick(['#8dab94','#bda862','#628b7c']));
  box(staticRoot,29,3.6,-21,10,7,4,'#697a61');box(staticRoot,29,7.25,-21,10.3,.3,4.3,'#c7c7a7');
  for(const x of [26.5,31.5]){box(staticRoot,x,3.7,-18.93,4.6,6.6,.1,'#809075');box(staticRoot,x,4,-18.8,.12,1,.2,'#d2c896');}
  for(let i=0;i<9;i++)box(staticRoot,25.4+i*.5,8.4,-21,.4,2.1+rand()*.5,1.5,pick(['#cb8459','#ddc57a','#5c8f85','#e8dfb9']));
  for(const x of [-16.5,16.5])for(const z of [-10.5,10.5]){
    box(staticRoot,x,3.6,z,1.05,7.2,1.05,'#835435');box(staticRoot,x,.4,z,1.13,.5,1.13,'#433d32');
  }
  box(staticRoot,0,2.2,0,33.7,.7,.7,'#80553b');box(staticRoot,0,6.4,0,38.3,1.6,26.3,'#99613c');
  box(staticRoot,0,7.38,0,39, .7,27,'#bd8853');
  box(staticRoot,0,7.78,0,38.9,.16,26.9,'#d6ad74');
  box(staticRoot,0,7.96,0,38,.2,26,'#6b8b50');
  for(let i=0;i<40;i++)box(staticRoot,-18.8+i*.96,6.4,13.161,.019,1.43,.012,'#a77248');
  for(let i=0;i<22;i++)box(staticRoot,19.16,6.4,-12.8+i*1.2,.014,.019,1.1,'#815536');
  // A voxel shoreline leaves a clean, separated bridge corridor on the right.
  box(land,-5.8,.13,0,26.4,.25,25.5,'#8ba665');
  box(land,12.9,.05,7.9,11,.1,9.8,'#83a268');
  box(land,12.9,.05,-10.4,11,.1,4.7,'#83a268');
  box(land,12.9,.04,-3.1,11,.12,9.6,waterMat);
  for(let i=0;i<10;i++)box(land,7.8+Math.sin(i)*.18,.21,-7.4+i*.87,.9,.44,.8,pick(['#b5b7a0','#a3ab91','#d0caac']));
  for(let i=0;i<80;i++){const x=8.3+rand()*10,z=-7.5+rand()*8.8;box(land,x,.115,z,.13+rand()*.6,.015,.06,'#74c0bd');}
  const ripples=[];for(let i=0;i<20;i++){const m=box(animated,8.2+rand()*10,.13,-7.1+rand()*8,.25+rand()*.6,.013,.045,'#bee0cc');ripples.push(m);}
  // Tiny ground blocks read as hand-laid turf, gravel and flower beds.
  for(let i=0;i<740;i++){
    const x=rand()*37-18.5,z=rand()*25-12.5;
    if(x>7.1&&z>-8&&z<1.9)continue;
    box(land,x,.267,z,.12+rand()*.34,.018,.12+rand()*.3,pick(['#8ca86a','#92ad6e','#79995d','#a2b779']));
  }

  // Analytic rounded rectangles keep train spacing and rail alignment exact.
  function loopPath(hx,hz,r){
    const seg=[{n:2*(hx-r),f:s=>({x:-hx+r+s,z:hz,dx:1,dz:0})},
      {n:Math.PI*r/2,f:s=>{const a=Math.PI/2-s/r;return{x:hx-r+r*Math.cos(a),z:hz-r+r*Math.sin(a),dx:Math.sin(a),dz:-Math.cos(a)}}},
      {n:2*(hz-r),f:s=>({x:hx,z:hz-r-s,dx:0,dz:-1})},
      {n:Math.PI*r/2,f:s=>{const a=-s/r;return{x:hx-r+r*Math.cos(a),z:-hz+r+r*Math.sin(a),dx:Math.sin(a),dz:-Math.cos(a)}}},
      {n:2*(hx-r),f:s=>({x:hx-r-s,z:-hz,dx:-1,dz:0})},
      {n:Math.PI*r/2,f:s=>{const a=-Math.PI/2-s/r;return{x:-hx+r+r*Math.cos(a),z:-hz+r+r*Math.sin(a),dx:Math.sin(a),dz:-Math.cos(a)}}},
      {n:2*(hz-r),f:s=>({x:-hx,z:-hz+r+s,dx:0,dz:1})},
      {n:Math.PI*r/2,f:s=>{const a=-Math.PI-s/r;return{x:-hx+r+r*Math.cos(a),z:hz-r+r*Math.sin(a),dx:Math.sin(a),dz:-Math.cos(a)}}}];
    const length=seg.reduce((v,s)=>v+s.n,0);return{length,at(d){let q=((d%length)+length)%length;for(const s of seg){if(q<=s.n)return s.f(q);q-=s.n;}return seg[0].f(0);}};
  }
  const outer=loopPath(17,10.6,4.4),inner=loopPath(15.4,8.9,4.1);
  function onWater(p){return p.x>12&&p.z>-7.7&&p.z<1.8;}
  function track(path){
