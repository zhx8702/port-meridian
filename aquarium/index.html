      const fins=[];for(const z of [-.18,.18]) {const fin=box(shape,.03,-.08,z,.22,.065,.17,colors[2]);fins.push(fin);}
      const lane=i%3;
      fishes.push({g:f,tail,fins,phase:i*2.399,rate:.19+random()*.09,rx:3.45+random()*.6,rz:.75+random()*.3,cy:4.5+lane*.74,cz:.15+lane*.2,kind,radius:.72*s});
    }
    for(let i=0;i<18;i++) makeFish(i);

    const bubbleGeo=new THREE.BoxGeometry(1,1,1);
    const bubbleMat=new THREE.MeshPhysicalMaterial({color:'#e3fff5',transparent:true,opacity:.5,roughness:.16,metalness:.15,depthWrite:false});
    const bubbleMesh=new THREE.InstancedMesh(bubbleGeo,bubbleMat,60);tank.add(bubbleMesh);
    const bubbleData=Array.from({length:60},(_,i)=>({phase:i/60,x:(random()-.5)*.37,z:(random()-.5)*.25,s:.028+random()*.055}));
    const foodMesh=new THREE.InstancedMesh(boxGeo,material('#b78c48'),24);foodMesh.count=0;tank.add(foodMesh);
    const foodData=Array.from({length:24},()=>({x:(random()-.5)*2.7,z:.15+random()*.85,start:random()*.5}));
    const causticMat=new THREE.MeshBasicMaterial({color:'#ffffd3',transparent:true,opacity:.16,depthWrite:false});
    const caustics=new THREE.InstancedMesh(boxGeo,causticMat,75);tank.add(caustics);
    const rays=[];
    for(let i=0;i<75;i++) rays.push({x:(random()-.5)*11.5,z:(random()-.5)*5.1,p:random()*7,l:.1+random()*.27});

    // Physical controls share their state with the accessible HTML controls.
    const panel=group(cabinet,0,.04,3.025);
    box(panel,0,0,0,5.3,1.36,.13,'#355448');
    for(const x of [-2.48,2.48]) for(const y of [-.51,.51]) {box(panel,x,y,.08,.065,.065,.025,'#afbaa4');box(panel,x,y,.096,.044,.008,.005,'#607365');}
    const targets=[];
    function target(mesh,action,title) {mesh.userData={action,title};targets.push(mesh);return mesh;}
    label(panel,'FLOW',-1.85,.39,.078,.8);box(panel,-1.85,-.03,.09,.77,.055,.025,'#172f28');
    for(let i=0;i<5;i++) box(panel,-2.19+i*.17,-.16,.1,.014,.045,.01,'#a5b4a0');
    const knob=target(box(panel,-1.85,-.015,.18,.18,.3,.16,'#d3c8a5'),'speed','游速 · 拖动推杆');
    const sliderHit=target(box(panel,-1.85,-.03,.17,.97,.4,.1,material('#ffffff',{transparent:true,opacity:0,depthWrite:false})),'speed','游速 · 拖动推杆');
    const toggles={};
    for(const [key,title,x] of [['light','LIGHT',-.75],['bubbles','AIR',.25],['cycle','DAY',1.25]]) {
      label(panel,title,x,.39,.078,.67);
      box(panel,x,-.04,.1,.28,.41,.07,'#1b332b');
      const toggle=target(box(panel,x,-.04,.17,.2,.29,.1,'#ccdbbd'),key,{light:'水族灯',bubbles:'气泵',cycle:'昼夜循环'}[key]);
      toggles[key]=toggle;
      box(panel,x,-.38,.09,.055,.035,.013,'#a2be85',{emissive:'#73b562',emissiveIntensity:.6});
    }
    label(panel,'FEED',2.12,.39,.078,.62);
    box(panel,2.12,-.04,.1,.39,.4,.09,'#233d33');
    const feedButton=target(box(panel,2.12,-.035,.2,.29,.29,.15,'#df8766'),'feed','投喂');
    label(cabinet,'L I T T L E   A Q U A R I U M',-4.15,.07,3.009,2.7,'#f3e2bd',null,25);
    label(cabinet,'EST. 2026',4.15,.07,3.009,1.8,'#f3e2bd',null,24);

    // Instance fixed voxel pieces by material while retaining moving parts and raycast targets.
    function batchBoxes(root, excluded=new Set()) {
      scene.updateMatrixWorld(true);
      const inverse=root.matrixWorld.clone().invert(),batches=new Map();
      function visit(node) {
        if(excluded.has(node))return;
        if(node.isMesh&&!node.isInstancedMesh&&node.geometry===boxGeo&&!node.material.transparent){
          const list=batches.get(node.material)||[];list.push(node);batches.set(node.material,list);
        }
        for(const child of node.children)visit(child);
      }
      visit(root);
      for(const [mat,list] of batches){if(list.length<2)continue;const mesh=new THREE.InstancedMesh(boxGeo,mat,list.length);
        list.forEach((m,i)=>{mesh.setMatrixAt(i,new THREE.Matrix4().multiplyMatrices(inverse,m.matrixWorld));m.removeFromParent();});
        mesh.castShadow=true;mesh.receiveShadow=true;root.add(mesh);
      }
    }
    for(const {p} of plants)batchBoxes(p);
    for(const f of fishes)batchBoxes(f.g,new Set([f.tail,...f.fins]));
    batchBoxes(scene,new Set([...plants.map(p=>p.p),...fishes.map(f=>f.g),...targets,snail]));

    const orbit={yaw:.25,pitch:.19,zoom:1};let distance=25,viewHeight=3.3;
    function resize() {camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);const low=innerHeight<530;distance=Math.max(low?31:25,7.4/(Math.tan(Math.PI/10)*camera.aspect)+3);viewHeight=low?2.2:3.3;scene.fog.near=distance+12;scene.fog.far=distance+65;updateCamera();}
    function updateCamera() {const d=distance*orbit.zoom;camera.position.set(Math.sin(orbit.yaw)*d,viewHeight+Math.sin(orbit.pitch)*d,Math.cos(orbit.yaw)*Math.cos(orbit.pitch)*d);camera.lookAt(0,viewHeight,0);}
    resize();addEventListener('resize',resize);
    const tip=document.getElementById('tip');let noticeTimer;
    function notify(message) {const e=document.getElementById('notice');e.textContent=message;e.style.opacity=1;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>e.style.opacity=0,2300);}
    function syncControls() {
      document.getElementById('speed').value=state.speed;knob.position.x=-2.18+state.speed*.33;
      for(const key of ['light','bubbles','cycle']) {document.getElementById(key).checked=state[key];toggles[key].rotation.x=state[key]?-.3:.3;}
      bubbleMesh.visible=state.bubbles;
    }
    function feed() {if(state.time<state.feedUntil)return;state.feedUntil=state.time+8;document.getElementById('feed').disabled=true;document.getElementById('feed').textContent='投喂中';notify('开饭了，慢慢吃。');}
    function act(action) {if(action==='feed')feed();else if(action!=='speed'){state[action]=!state[action];syncControls();}}
    document.getElementById('speed').addEventListener('input',e=>{state.speed=Number(e.target.value);syncControls();});
    for(const key of ['light','bubbles','cycle']) document.getElementById(key).addEventListener('change',e=>{state[key]=e.target.checked;syncControls();});
    document.getElementById('feed').addEventListener('click',feed);
    document.getElementById('reset').addEventListener('click',()=>{orbit.yaw=.25;orbit.pitch=.19;orbit.zoom=1;updateCamera();});
    const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
    function hit(e) {pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);raycaster.setFromCamera(pointer,camera);return raycaster.intersectObjects(targets,false)[0];}
    let drag=null; const touches=new Map();let pinch=0;
    canvas.addEventListener('pointerdown',e=>{
      touches.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);
      if(touches.size===2){const a=[...touches.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);drag=null;return;}
      const h=hit(e);drag={id:e.pointerId,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,action:h?.object.userData.action||'orbit',moved:false};
      if(drag.action==='speed')setSlider(e);
    });
    const panelPlane=new THREE.Plane(new THREE.Vector3(0,0,1),-3.2),intersection=new THREE.Vector3();
    function setSlider(e) {hit(e);if(raycaster.ray.intersectPlane(panelPlane,intersection)){state.speed=THREE.MathUtils.clamp((intersection.x+2.18)/.33,0,2);syncControls();}}
    canvas.addEventListener('pointermove',e=>{
      if(touches.has(e.pointerId))touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(touches.size===2){const a=[...touches.values()],n=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);orbit.zoom=THREE.MathUtils.clamp(orbit.zoom*pinch/n,.8,1.3);pinch=n;updateCamera();return;}
      if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved ||= Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>5;if(drag.action==='speed')setSlider(e);else if(drag.action==='orbit'){orbit.yaw=THREE.MathUtils.clamp(orbit.yaw-dx*.004,-.68,.68);orbit.pitch=THREE.MathUtils.clamp(orbit.pitch+dy*.003,.03,.44);updateCamera();}drag.x=e.clientX;drag.y=e.clientY;tip.style.display='none';return;}
      const h=hit(e);canvas.style.cursor=h?(h.object.userData.action==='speed'?'ew-resize':'pointer'):'grab';
      if(h){tip.textContent=h.object.userData.title;tip.style.display='block';tip.style.left=Math.min(e.clientX+13,innerWidth-155)+'px';tip.style.top=(e.clientY-37)+'px';}else tip.style.display='none';
    });
    function endPointer(e) {touches.delete(e.pointerId);if(drag&&drag.id===e.pointerId){if(!drag.moved&&drag.action!=='orbit'&&drag.action!=='speed')act(drag.action);drag=null;}canvas.style.cursor='grab';}
    canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',e=>{touches.delete(e.pointerId);drag=null;});
    canvas.addEventListener('pointerleave',()=>tip.style.display='none');
    canvas.addEventListener('wheel',e=>{e.preventDefault();orbit.zoom=THREE.MathUtils.clamp(orbit.zoom+e.deltaY*.0005,.8,1.3);updateCamera();},{passive:false});
    syncControls();
    let swimTime=0,frameCount=0,lastDayLabel='';
    const dayColor=new THREE.Color('#edf1ee'),nightColor=new THREE.Color('#536f72');
    const fishPositions=fishes.map(()=>new THREE.Vector3());
    function animate() {
      requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);state.time+=dt;swimTime+=dt*state.speed;
      if(state.cycle)state.day=(state.day+dt/180)%1;
      const daylight=THREE.MathUtils.smoothstep(Math.sin((state.day-.25)*Math.PI*2),-.24,.4);
      ambient.intensity=.5+daylight*1.3;sun.intensity=.15+daylight*2.3;fillLight.intensity=.4+daylight*.7;
      tankLight.intensity=state.light?22+(1-daylight)*22:0;lampMat.emissiveIntensity=state.light?2.1:0;
      lampFill.intensity=state.light?10+(1-daylight)*12:0;
      scene.background.copy(nightColor).lerp(dayColor,daylight);scene.fog.color.copy(scene.background);
      const feeding=state.time<state.feedUntil,feedAge=8-(state.feedUntil-state.time);
      // Swimming lanes stay above hardscape and in front of the tall background planting.
      for(let i=0;i<fishes.length;i++) {const f=fishes[i],a=swimTime*f.rate+f.phase;
        const pos=fishPositions[i];pos.set(Math.cos(a)*f.rx,f.cy+Math.sin(a*1.4+f.phase)*.17,f.cz+Math.sin(a)*f.rz);
        if(feeding){const w=Math.sin(Math.min(feedAge/1.3,1)*Math.PI/2)*Math.min((state.feedUntil-state.time)/1.5,1);pos.lerp(new THREE.Vector3(Math.cos(a)*3.3,5.3+(i%3)*.38,.3+Math.sin(a)*1.15),w*.65);}
      }
      // Separate bounding spheres before applying transforms, including the feeding cluster.
      for(let pass=0;pass<18;pass++){for(let i=0;i<fishes.length;i++)for(let j=i+1;j<fishes.length;j++) {
        const a=fishPositions[i],b=fishPositions[j],min=fishes[i].radius+fishes[j].radius+.14,delta=new THREE.Vector3().subVectors(a,b),len=delta.length();
        if(len<min){if(len<.001)delta.set(1,0,0);else delta.divideScalar(len);delta.multiplyScalar((min-len)*.5);a.add(delta);b.sub(delta);}
      }for(const p of fishPositions){p.x=THREE.MathUtils.clamp(p.x,-4.45,4.45);p.y=THREE.MathUtils.clamp(p.y,4.35,6.44);p.z=THREE.MathUtils.clamp(p.z,-.65,1.63);}}
      for(let i=0;i<fishes.length;i++) {const f=fishes[i],a=swimTime*f.rate+f.phase;f.g.position.copy(fishPositions[i]);f.g.rotation.y=Math.atan2(-Math.cos(a)*f.rz,-Math.sin(a)*f.rx);f.g.rotation.z=Math.cos(a*1.4+f.phase)*.035;f.tail.rotation.y=Math.sin(swimTime*8+f.phase)*.45;for(let j=0;j<f.fins.length;j++)f.fins[j].rotation.x=Math.sin(swimTime*9+i)*.4*(j===0?1:-1);}
      for(const {p,phase} of plants) {p.rotation.x=Math.sin(state.time*1.2+phase)*.025;p.rotation.z=Math.sin(state.time*.9+phase)*.025;}
      for(let i=0;i<bubbleData.length;i++){const b=bubbleData[i],h=((state.time*.19+b.phase)%1)*4.85;dummy.position.set(-3.5+b.x+Math.sin(h*3+state.time)*.055,1.98+h,1.15+b.z);dummy.scale.setScalar(b.s*(1+h*.07));dummy.rotation.set(state.time*.2+i,0,state.time*.4);dummy.updateMatrix();bubbleMesh.setMatrixAt(i,dummy.matrix);}bubbleMesh.instanceMatrix.needsUpdate=true;
      const vertices=water.geometry.attributes.position;for(let i=0;i<vertices.count;i++)vertices.setZ(i,Math.sin(vertices.getX(i)*2+state.time*1.3)*Math.cos(vertices.getY(i)*2+state.time)*.018);vertices.needsUpdate=true;water.geometry.computeVertexNormals();
      for(let i=0;i<rays.length;i++){const r=rays[i];dummy.position.set(r.x+Math.sin(state.time*.6+r.p)*.15,1.755,r.z+Math.cos(state.time*.5+r.p)*.12);dummy.rotation.set(0,Math.sin(state.time*.3+r.p),0);dummy.scale.set(r.l,.003,.025+Math.sin(state.time+r.p)*.012);dummy.updateMatrix();caustics.setMatrixAt(i,dummy.matrix);}caustics.instanceMatrix.needsUpdate=true;causticMat.opacity=(state.light?.23:.06)*(.5+daylight*.5);
      foodMesh.count=feeding?24:0;
      if(feeding){for(let i=0;i<24;i++){const f=foodData[i];dummy.position.set(f.x+Math.sin(state.time+i)*.035,6.8-Math.max(0,feedAge-f.start)*.115,f.z);dummy.rotation.set(0,state.time,0);dummy.scale.setScalar(.045*Math.min(1,(8-feedAge)*.5));dummy.updateMatrix();foodMesh.setMatrixAt(i,dummy.matrix);}foodMesh.instanceMatrix.needsUpdate=true;feedButton.position.z=.16;}else {feedButton.position.z=.2;const b=document.getElementById('feed');if(b.disabled){b.disabled=false;b.textContent='投喂';}}
      snail.position.x=Math.sin(state.time*.025)*.65;
      if(frameCount++%20===0){document.body.classList.toggle('night',daylight<.35);const h=Math.floor(state.day*24),m=Math.floor(state.day*1440)%60;document.getElementById('clock-label').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');const text=daylight>.6?'日间':daylight<.2?'夜间':'晨昏';if(text!==lastDayLabel){document.getElementById('day-label').textContent=text;lastDayLabel=text;}}
      renderer.render(scene,camera);
    }
    animate();document.getElementById('loading').classList.add('gone');
    // Small inspection surface for deterministic render and interaction checks.
    window.aquarium={state,scene,camera,renderer,fishes,targets,orbit,feed,ready:true,projectControl(action){const m=targets.find(t=>t.userData.action===action),v=m.getWorldPosition(new THREE.Vector3()).project(camera);return{x:(v.x+1)*innerWidth/2,y:(1-v.y)*innerHeight/2};}};
  } catch(error) {console.error(error);document.querySelector('#loading small').textContent='无法启动 3D 场景，请在 Chrome 中开启硬件加速后重试。';} }
  </script>
